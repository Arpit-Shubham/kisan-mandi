<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KisanMandi — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand-title">🌾 KisanMandi</div>
      <button id="langToggleBtn" class="lang-btn" onclick="App.toggleLang()">हिंदी</button>
    </div>
  </header>

  <main class="app-container" style="max-width: 480px; margin-top: 40px;">
    <div class="card">
      <h2 style="font-size: 1.3rem; margin-bottom: 8px;">
        <span class="hi">किसान लॉगिन / पंजीकरण</span>
        <span class="en">Farmer Login & Registration</span>
      </h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
        <span class="hi">अपने पंजीकृत मोबाइल नंबर से प्रवेश करें</span>
        <span class="en">Access your procurement mandi dashboard</span>
      </p>

      <div id="step-details">
        <div class="form-group">
          <label><span class="hi">पूरा नाम</span><span class="en">Full Name</span></label>
          <input type="text" id="nameInput" class="form-control" placeholder="e.g. Ramesh Kumar">
        </div>
        <div class="form-group">
          <label><span class="hi">गृह राज्य</span><span class="en">Home State</span></label>
          <select id="stateSelect" class="form-control">
            <option value="Bihar">Bihar</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Punjab">Punjab</option>
            <option value="Haryana">Haryana</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="West Bengal">West Bengal</option>
          </select>
        </div>
        <div class="form-group">
          <label><span class="hi">मोबाइल नंबर</span><span class="en">Mobile Number</span></label>
          <input type="tel" id="phoneInput" class="form-control" placeholder="10-digit phone number" maxlength="10">
        </div>
        <button class="btn btn-primary" onclick="sendOTP()">
          <span class="hi">ओटीपी प्राप्त करें</span><span class="en">Send OTP</span>
        </button>
      </div>

      <div id="step-otp" style="display: none;">
        <div class="form-group">
          <label><span class="hi">४-अंकों का ओटीपी दर्ज करें</span><span class="en">Enter 4-Digit OTP</span></label>
          <input type="number" id="otpInput" class="form-control" placeholder="Enter OTP received via SMS">
        </div>
        <button class="btn btn-primary" onclick="verifyOTP()">
          <span class="hi">सत्यापित करें एवं आगे बढ़ें</span><span class="en">Verify & Login</span>
        </button>
      </div>
    </div>
  </main>
  <div id="toast"></div>

  <script src="js/app.js"></script>
  <script>
    App.initAuthGuard(true);

    async function sendOTP() {
      const name = document.getElementById('nameInput').value.trim();
      const state = document.getElementById('stateSelect').value;
      const phone = document.getElementById('phoneInput').value.trim();

      if (!name || phone.length !== 10) {
        return App.showToast('Please enter a valid name and 10-digit number');
      }

      try {
        const res = await fetch(`${API_BASE}/auth/send-otp`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ name, state, phone })
        });
        const data = await res.json();
        if (res.ok) {
          App.showToast('OTP sent to your phone');
          document.getElementById('step-details').style.display = 'none';
          document.getElementById('step-otp').style.display = 'block';
        } else {
          App.showToast(data.detail || 'Failed to send OTP');
        }
      } catch (e) {
        App.showToast('Server connection error');
      }
    }

    async function verifyOTP() {
      const phone = document.getElementById('phoneInput').value.trim();
      const otp = document.getElementById('otpInput').value.trim();

      try {
        const res = await fetch(`${API_BASE}/auth/verify-otp`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ phone, otp })
        });
        const data = await res.json();
        if (res.ok) {
          App.setUser(data.user);
          window.location.href = 'home.html';
        } else {
          App.showToast(data.detail || 'Invalid verification code');
        }
      } catch (e) {
        App.showToast('Server connection error');
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>लॉगिन / Login — किसानमंडी KisanMandi</title>
<meta name="description" content="किसानमंडी में अपना मोबाइल नंबर दर्ज करके लॉगिन करें / Log in to KisanMandi with your mobile number." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">

<main class="app no-bottom-nav">
  <div class="app-main" style="padding:0;">

    <!-- Hero / brand -->
    <section class="login-hero">
      <div class="sun" aria-hidden="true">
        <!-- wheat icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v15" />
          <path d="M12 6.5c-1.8-1.2-2.6-.2-4-.2 0 1.8 1.6 2.7 4 2.7" />
          <path d="M12 6.5c1.8-1.2 2.6-.2 4-.2 0 1.8-1.6 2.7-4 2.7" />
          <path d="M12 9.8c-1.8-1.2-2.6-.2-4-.2 0 1.8 1.6 2.7 4 2.7" />
          <path d="M12 9.8c1.8-1.2 2.6-.2 4-.2 0 1.8-1.6 2.7-4 2.7" />
          <path d="M12 13.1c-1.8-1.2-2.6-.2-4-.2 0 1.8 1.6 2.7 4 2.7" />
          <path d="M12 13.1c1.8-1.2 2.6-.2 4-.2 0 1.8-1.6 2.7-4 2.7" />
          <circle cx="12" cy="3.4" r="1.1" fill="currentColor" stroke="none" />
        </svg>
      </div>
      <div class="brand">
        <h1>किसानमंडी</h1>
        <p class="brand-en">KisanMandi</p>
        <p class="brand-tag">किसान प्रबंधन प्रणाली / Procurement System</p>
      </div>
    </section>

    <!-- Login form -->
    <section class="login-form">
      <form id="login-form" novalidate>
        <label class="field-label" for="phone">
          अपना मोबाइल नंबर दर्ज करें / Enter Mobile Number
        </label>
        <div class="phone-input">
          <span class="cc" aria-hidden="true">+91</span>
          <input
            type="tel"
            id="phone"
            name="phone"
            inputmode="numeric"
            autocomplete="tel-national"
            placeholder="98765 43210"
            maxlength="10"
            aria-describedby="phone-error"
          />
        </div>
        <p class="field-error" id="phone-error" role="alert"></p>

        <button type="submit" class="btn btn-primary btn-block" id="send-otp-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
          ओटीपी भेजें / Send OTP
        </button>
      </form>

      <a class="help-link" href="tel:18001234567">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        मदद चाहिए? यहाँ कॉल करें / Need help logging in? Call Support
      </a>

      <div class="demo-box" role="note">
        <strong>डेमो खाता / Demo account</strong>
        मोबाइल / Mobile: 98765 43210 &nbsp;•&nbsp; OTP: 1234
        <button type="button" id="demo-login-btn">डेमो के रूप में लॉगिन करें / Continue with demo account</button>
      </div>
    </section>
  </div>
</main>

<div id="otp-panel" class="card" style="display:none; position:fixed; inset:auto 16px 16px 16px; max-width:448px; margin:0 auto; left:0; right:0; z-index:40;">
  <label class="field-label" for="otp-input">OTP दर्ज करें / Enter the OTP sent to your phone</label>
  <div class="phone-input">
    <input type="tel" id="otp-input" inputmode="numeric" maxlength="4" placeholder="1234" />
  </div>
  <p class="field-error" id="otp-error" role="alert"></p>
  <button type="button" class="btn btn-primary btn-block" id="verify-otp-btn">सत्यापित करें / Verify &amp; Continue</button>
</div>

<script src="js/app.js"></script>
<script>
  const phoneInput = document.getElementById("phone");
  const phoneError = document.getElementById("phone-error");
  const loginForm = document.getElementById("login-form");
  const otpPanel = document.getElementById("otp-panel");
  const otpInput = document.getElementById("otp-input");
  const otpError = document.getElementById("otp-error");
  const verifyBtn = document.getElementById("verify-otp-btn");
  const demoBtn = document.getElementById("demo-login-btn");

  function digitsOnly(v) { return v.replace(/\D/g, ""); }

  phoneInput.addEventListener("input", () => {
    phoneInput.value = digitsOnly(phoneInput.value).slice(0, 10);
  });

  function completeLogin(phone) {
    const isDemo = phone === KM.DEMO_ACCOUNT.phone;
    KM.setState({
      loggedIn: true,
      user: {
        phone,
        name: isDemo ? KM.DEMO_ACCOUNT.name : "किसान",
        nameEn: isDemo ? KM.DEMO_ACCOUNT.nameEn : "Farmer",
      },
    });
    KM.toast("लॉगिन सफल / Logged in successfully");
    setTimeout(() => { window.location.href = "home.html"; }, 500);
  }

  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const value = digitsOnly(phoneInput.value);
    if (value.length !== 10) {
      phoneError.textContent = "कृपया 10 अंकों का मोबाइल नंबर दर्ज करें / Enter a valid 10-digit number";
      return;
    }
    phoneError.textContent = "";
    otpPanel.style.display = "block";
    otpInput.focus();
    KM.toast(
      value === KM.DEMO_ACCOUNT.phone
        ? "डेमो OTP भेजा गया: 1234 / Demo OTP sent: 1234"
        : "OTP भेजा गया / OTP sent (demo: 1234)"
    );
  });

  verifyBtn.addEventListener("click", () => {
    const phone = digitsOnly(phoneInput.value);
    const code = otpInput.value.trim();
    if (code !== "1234") {
      otpError.textContent = "गलत OTP / Incorrect OTP. डेमो OTP: 1234";
      return;
    }
    otpError.textContent = "";
    completeLogin(phone);
  });

  demoBtn.addEventListener("click", () => {
    phoneInput.value = KM.DEMO_ACCOUNT.phone;
    completeLogin(KM.DEMO_ACCOUNT.phone);
  });
</script>
</body>
</html>

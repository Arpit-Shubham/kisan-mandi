<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KisanMandi — Live Queue</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand-title">🌾 KisanMandi</div>
      <nav class="desktop-nav">
        <a href="home.html">Home</a>
        <a href="book-slot.html">Book Slot</a>
        <a href="queue-status.html" class="active">Live Queue</a>
        <a href="tracking.html">Status</a>
        <a href="admin.html">Admin</a>
      </nav>
      <div class="header-actions">
        <button id="langToggleBtn" class="lang-btn" onclick="App.toggleLang()">हिंदी</button>
      </div>
    </div>
  </header>

  <main class="app-container" style="max-width: 680px;">
    <div class="card" style="text-align: center; padding: 32px 16px;">
      <div style="font-size: 0.9rem; color: var(--text-muted);">
        <span class="hi">वर्तमान में चालू टोकन</span>
        <span class="en">Currently Serving Token</span>
      </div>
      <div id="servingToken" style="font-size: 3rem; font-weight: 800; color: var(--primary); margin: 8px 0;">--</div>
      <div id="servingCrop" style="font-size: 0.95rem; color: var(--text-main);">Crop: In queue</div>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 14px;"><span class="hi">आपकी टोकन जानकारी</span><span class="en">Your Booking Queue Status</span></h3>
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border);">
        <span style="color: var(--text-muted);">Your Token:</span>
        <strong id="myToken">None</strong>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border);">
        <span style="color: var(--text-muted);">Farmers Ahead:</span>
        <strong id="aheadCount">0</strong>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 10px 0;">
        <span style="color: var(--text-muted);">Estimated Wait Time:</span>
        <strong id="etaTime">0 Mins</strong>
      </div>
      <button class="btn btn-outline" style="width: 100%; margin-top: 14px;" onclick="loadQueue()">🔄 Refresh Realtime</button>
    </div>
  </main>
  <div id="toast"></div>

  <nav class="mobile-nav">
    <a href="home.html" class="nav-tab"><span>🏠</span><span>Home</span></a>
    <a href="book-slot.html" class="nav-tab"><span>📅</span><span>Book</span></a>
    <a href="queue-status.html" class="nav-tab active"><span>⏱️</span><span>Queue</span></a>
    <a href="tracking.html" class="nav-tab"><span>📋</span><span>Status</span></a>
  </nav>

  <script src="js/app.js"></script>
  <script>
    App.initAuthGuard();
    const token = localStorage.getItem('km_last_token') || '';

    async function loadQueue() {
      try {
        const res = await fetch(`${API_BASE}/queue/realtime?token=${token}`);
        const data = await res.json();
        document.getElementById('servingToken').innerText = data.currently_serving;
        document.getElementById('servingCrop').innerText = `Processing Crop: ${data.currently_serving_crop}`;
        document.getElementById('myToken').innerText = data.your_token || 'No Active Token';
        document.getElementById('aheadCount').innerText = `${data.tokens_ahead} Farmers`;
        document.getElementById('etaTime').innerText = `~${data.eta_minutes} Mins`;
      } catch (e) {
        App.showToast('Could not load queue status');
      }
    }

    loadQueue();
    setInterval(loadQueue, 8000); // 8-second auto polling
  </script>
</body>
</html>

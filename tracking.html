<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KisanMandi — Tracking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand-title">🌾 KisanMandi</div>
      <nav class="desktop-nav">
        <a href="home.html">Home</a>
        <a href="book-slot.html">Book Slot</a>
        <a href="queue-status.html">Live Queue</a>
        <a href="tracking.html" class="active">Status</a>
        <a href="admin.html">Admin</a>
      </nav>
      <div class="header-actions">
        <button id="langToggleBtn" class="lang-btn" onclick="App.toggleLang()">हिंदी</button>
      </div>
    </div>
  </header>

  <main class="app-container" style="max-width: 680px;">
    <div class="card" id="trackingDetails">
      <p style="color: var(--text-muted);">Fetching your active procurement details...</p>
    </div>
  </main>
  <div id="toast"></div>

  <nav class="mobile-nav">
    <a href="home.html" class="nav-tab"><span>🏠</span><span>Home</span></a>
    <a href="book-slot.html" class="nav-tab"><span>📅</span><span>Book</span></a>
    <a href="queue-status.html" class="nav-tab"><span>⏱️</span><span>Queue</span></a>
    <a href="tracking.html" class="nav-tab active"><span>📋</span><span>Status</span></a>
  </nav>

  <script src="js/app.js"></script>
  <script>
    App.initAuthGuard();
    const token = localStorage.getItem('km_last_token');

    async function loadTracking() {
      if (!token) {
        document.getElementById('trackingDetails').innerHTML = `<p style="color:var(--text-muted)">No active booking found.</p>`;
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/queue/realtime?token=${token}`);
        const data = await res.json();
        const b = data.user_booking;
        if (!b) {
          document.getElementById('trackingDetails').innerHTML = `<p>No booking record found for Token: ${token}</p>`;
          return;
        }

        document.getElementById('trackingDetails').innerHTML = `
          <h2 style="margin-bottom: 12px;">Token: ${b.token}</h2>
          <div style="display:flex; flex-direction:column; gap: 10px; margin-top: 14px;">
            <div><strong>Crop Type:</strong> ${b.crop}</div>
            <div><strong>Date & Time Slot:</strong> ${b.date} (${b.time_chunk})</div>
            <div><strong>Queue State:</strong> <span class="badge badge-success">${b.status}</span></div>
            <div><strong>Payment Status:</strong> <span class="badge ${b.payment_status === 'Paid' ? 'badge-success' : 'badge-warning'}">${b.payment_status}</span></div>
          </div>
        `;
      } catch (e) {
        App.showToast('Failed to load tracking data');
      }
    }
    loadTracking();
  </script>
</body>
</html>

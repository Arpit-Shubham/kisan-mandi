<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KisanMandi — Tracking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 <span class="hi">ट्रैकिंग स्थिति</span><span class="en">Booking Tracking</span></h1>
      <button id="langToggleBtn" class="lang-btn" onclick="App.toggleLang()">हिंदी</button>
    </header>

    <div class="card" id="trackingDetails">
      <p style="font-size: 0.9rem; color: var(--text-muted);">Loading your active booking...</p>
    </div>

    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">🏠<span>Home</span></a>
      <a href="book-slot.html" class="nav-item">📅<span>Book</span></a>
      <a href="queue-status.html" class="nav-item">⏱️<span>Queue</span></a>
      <a href="tracking.html" class="nav-item active">📋<span>Status</span></a>
    </nav>
  </div>
  <div id="toast"></div>

  <script src="js/app.js"></script>
  <script>
    App.initAuthGuard();
    const token = localStorage.getItem('km_last_token');

    async function loadTracking() {
      if (!token) {
        document.getElementById('trackingDetails').innerHTML = `<p>No active booking found.</p>`;
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/queue/realtime?token=${token}`);
        const data = await res.json();
        const b = data.user_booking;
        if (!b) {
          document.getElementById('trackingDetails').innerHTML = `<p>No active record for token ${token}</p>`;
          return;
        }

        document.getElementById('trackingDetails').innerHTML = `
          <div class="card-header">Token: ${b.token}</div>
          <div style="margin-bottom: 8px;"><strong>Crop:</strong> ${b.crop}</div>
          <div style="margin-bottom: 8px;"><strong>Date & Time:</strong> ${b.date} (${b.time_chunk})</div>
          <div style="margin-bottom: 8px;"><strong>Queue Status:</strong> <span class="badge badge-success">${b.status}</span></div>
          <div style="margin-bottom: 8px;"><strong>Payment:</strong> <span class="badge ${b.payment_status === 'Paid' ? 'badge-success' : 'badge-danger'}">${b.payment_status}</span></div>
        `;
      } catch (e) {
        App.showToast('Failed to load tracking');
      }
    }
    loadTracking();
  </script>
</body>
</html>

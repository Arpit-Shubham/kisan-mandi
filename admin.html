<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KisanMandi — Admin Panel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand-title">🌾 Mandi Admin Dashboard</div>
      <button class="btn btn-outline btn-sm" onclick="loadAdmin()">Refresh</button>
    </div>
  </header>

  <main class="app-container">
    <div class="card">
      <h2 style="font-size: 1.2rem; margin-bottom: 16px;">Live Queue Controller & Payment Verifications</h2>
      <div id="adminList" style="display: flex; flex-direction: column; gap: 12px;">
        <p style="color: var(--text-muted);">Loading bookings...</p>
      </div>
    </div>
  </main>
  <div id="toast"></div>

  <script src="js/app.js"></script>
  <script>
    async function loadAdmin() {
      try {
        const res = await fetch(`${API_BASE}/admin/all`);
        const data = await res.json();
        const container = document.getElementById('adminList');
        container.innerHTML = '';

        if (!data.bookings.length) {
          container.innerHTML = '<p style="color:var(--text-muted);">No active bookings logged in the system.</p>';
          return;
        }

        data.bookings.forEach(b => {
          const item = document.createElement('div');
          item.className = 'admin-card';
          item.innerHTML = `
            <div class="admin-card-header">
              <strong>${b.token} — ${b.crop}</strong>
              <span class="badge badge-success">${b.status}</span>
            </div>
            <div style="font-size:0.85rem; color:var(--text-muted);">Farmer: ${b.phone} | Slot: ${b.time_chunk} (${b.date})</div>
            <div style="font-size:0.85rem; margin-top:4px;">Payment: <strong>${b.payment_status}</strong></div>
            <div class="admin-actions">
              <button class="btn btn-outline btn-sm" onclick="updateStatus('${b.token}', 'Under Process')">Call to Gate</button>
              <button class="btn btn-outline btn-sm" onclick="updateStatus('${b.token}', 'Completed')">Mark Completed</button>
              <button class="btn btn-primary btn-sm" onclick="updatePayment('${b.token}', 'Paid')">Confirm Payment</button>
            </div>
          `;
          container.appendChild(item);
        });
      } catch (e) {
        App.showToast('Could not load admin bookings');
      }
    }

    async function updateStatus(token, status) {
      await fetch(`${API_BASE}/admin/update`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ token, status })
      });
      App.showToast(`Token ${token} updated to ${status}`);
      loadAdmin();
    }

    async function updatePayment(token, payment_status) {
      await fetch(`${API_BASE}/admin/update`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ token, payment_status })
      });
      App.showToast(`Token ${token} marked as Paid`);
      loadAdmin();
    }

    loadAdmin();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KisanMandi — Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🛠️ Mandi Admin Panel</h1>
      <button class="lang-btn" onclick="loadAdmin()">Refresh</button>
    </header>

    <div class="card">
      <div class="card-header">Live Queue & Payment Manager</div>
      <div id="adminList" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
        <p>Loading bookings...</p>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">🏠<span>Home</span></a>
      <a href="book-slot.html" class="nav-item">📅<span>Book</span></a>
      <a href="queue-status.html" class="nav-item">⏱️<span>Queue</span></a>
      <a href="tracking.html" class="nav-item">📋<span>Status</span></a>
    </nav>
  </div>
  <div id="toast"></div>

  <script src="js/app.js"></script>
  <script>
    async function loadAdmin() {
      try {
        const res = await fetch(`${API_BASE}/admin/all`);
        const data = await res.json();
        const container = document.getElementById('adminList');
        container.innerHTML = '';

        if (!data.bookings.length) {
          container.innerHTML = '<p style="color:var(--text-muted);">No bookings available.</p>';
          return;
        }

        data.bookings.forEach(b => {
          const item = document.createElement('div');
          item.style.border = '1px solid var(--border)';
          item.style.padding = '10px';
          item.style.borderRadius = '8px';
          item.innerHTML = `
            <div style="display:flex; justify-content:space-between;">
              <strong>${b.token} — ${b.crop}</strong>
              <span class="badge badge-success">${b.status}</span>
            </div>
            <div style="font-size:0.8rem; color:var(--text-muted); margin: 4px 0;">Phone: ${b.phone} | Slot: ${b.time_chunk}</div>
            <div style="font-size:0.8rem; margin-bottom: 8px;">Payment: <strong>${b.payment_status}</strong></div>
            <div style="display:flex; gap: 6px;">
              <button class="btn btn-outline" style="padding:4px 8px; font-size:0.75rem;" onclick="updateStatus('${b.token}', 'Under Process')">Call Next</button>
              <button class="btn btn-outline" style="padding:4px 8px; font-size:0.75rem;" onclick="updateStatus('${b.token}', 'Completed')">Complete</button>
              <button class="btn btn-primary" style="padding:4px 8px; font-size:0.75rem;" onclick="updatePayment('${b.token}', 'Paid')">Mark Paid</button>
            </div>
          `;
          container.appendChild(item);
        });
      } catch (e) {
        App.showToast('Failed loading admin data');
      }
    }

    async function updateStatus(token, status) {
      await fetch(`${API_BASE}/admin/update`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ token, status })
      });
      App.showToast(`Token ${token} set to ${status}`);
      loadAdmin();
    }

    async function updatePayment(token, payment_status) {
      await fetch(`${API_BASE}/admin/update`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ token, payment_status })
      });
      App.showToast(`Token ${token} payment updated`);
      loadAdmin();
    }

    loadAdmin();
  </script>
</body>
</html>

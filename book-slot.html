<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KisanMandi — Book Slot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand-title">🌾 KisanMandi</div>
      <nav class="desktop-nav">
        <a href="home.html">Home</a>
        <a href="book-slot.html" class="active">Book Slot</a>
        <a href="queue-status.html">Live Queue</a>
        <a href="tracking.html">Status</a>
        <a href="admin.html">Admin</a>
      </nav>
      <div class="header-actions">
        <button id="langToggleBtn" class="lang-btn" onclick="App.toggleLang()">हिंदी</button>
      </div>
    </div>
  </header>

  <main class="app-container" style="max-width: 720px;">
    <div class="card">
      <h2 style="margin-bottom: 16px;">
        <span class="hi">मंडी स्लॉट बुकिंग</span><span class="en">Procurement Slot Booking</span>
      </h2>

      <div class="form-group">
        <label><span class="hi">फसल का चयन करें</span><span class="en">Select Crop Category</span></label>
        <select id="cropSelect" class="form-control">
          <option value="Wheat (गेहूं)">Wheat (गेहूं)</option>
          <option value="Paddy (धान)">Paddy (धान)</option>
          <option value="Pulses (दालें)">Pulses (दालें)</option>
          <option value="Other Cereals (मक्का / बाजरा)">Other Cereals (मक्का / बाजरा)</option>
          <option value="Fruits (फल)">Fruits (फल)</option>
          <option value="Vegetables (सब्जियां)">Vegetables (सब्जियां)</option>
          <option value="Oilseeds (तिलहन / सरसों)">Oilseeds (तिलहन / सरसों)</option>
        </select>
      </div>

      <div class="form-group">
        <label><span class="hi">तारीख चुनें</span><span class="en">Select Booking Date</span></label>
        <input type="date" id="dateInput" class="form-control" onchange="fetchAvailability()">
      </div>

      <label style="font-size: 0.9rem; font-weight: 600; display: block; margin-top: 14px;">
        <span class="hi">उपलब्ध समय स्लॉट (प्रति स्लॉट १२ क्षमता)</span>
        <span class="en">Available Time Slots (12 capacity each)</span>
      </label>
      
      <div id="slotsContainer" class="slot-grid">
        <p style="color: var(--text-muted); font-size: 0.9rem;">Fetching live slot capacity...</p>
      </div>

      <button id="bookBtn" class="btn btn-primary" style="margin-top: 24px;" onclick="confirmBooking()" disabled>
        <span class="hi">स्लॉट बुक करें</span><span class="en">Confirm Slot Booking</span>
      </button>
    </div>
  </main>
  <div id="toast"></div>

  <nav class="mobile-nav">
    <a href="home.html" class="nav-tab"><span>🏠</span><span>Home</span></a>
    <a href="book-slot.html" class="nav-tab active"><span>📅</span><span>Book</span></a>
    <a href="queue-status.html" class="nav-tab"><span>⏱️</span><span>Queue</span></a>
    <a href="tracking.html" class="nav-tab"><span>📋</span><span>Status</span></a>
  </nav>

  <script src="js/app.js"></script>
  <script>
    App.initAuthGuard();
    const user = App.getUser();
    let selectedChunk = null;

    document.getElementById('dateInput').valueAsDate = new Date();

    async function fetchAvailability() {
      const date = document.getElementById('dateInput').value;
      if (!date) return;
      try {
        const res = await fetch(`${API_BASE}/slots/availability?date=${date}&mandi_id=${user.mandi.id}`);
        const data = await res.json();
        renderSlots(data.slots);
      } catch (e) {
        App.showToast('Could not fetch slot availability');
      }
    }

    function renderSlots(slots) {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';
      selectedChunk = null;
      document.getElementById('bookBtn').disabled = true;

      slots.forEach(s => {
        const div = document.createElement('div');
        div.className = `slot-item ${s.is_full ? 'full' : ''}`;
        div.innerHTML = `
          <div>
            <strong>${s.chunk}</strong>
          </div>
          <span class="badge ${s.remaining > 0 ? 'badge-success' : 'badge-danger'}">
            ${s.remaining} / 12 slots available
          </span>
        `;
        if (!s.is_full) {
          div.onclick = () => {
            document.querySelectorAll('.slot-item').forEach(el => el.classList.remove('active'));
            div.classList.add('active');
            selectedChunk = s.chunk;
            document.getElementById('bookBtn').disabled = false;
          };
        }
        container.appendChild(div);
      });
    }

    async function confirmBooking() {
      if (!selectedChunk) return;
      const crop = document.getElementById('cropSelect').value;
      const date = document.getElementById('dateInput').value;

      try {
        const res = await fetch(`${API_BASE}/slots/book`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            phone: user.phone,
            mandi_id: user.mandi.id,
            date,
            time_chunk: selectedChunk,
            crop_type: crop
          })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('km_last_token', data.booking.token);
          App.showToast('Slot booked successfully!');
          setTimeout(() => { window.location.href = 'queue-status.html'; }, 1000);
        } else {
          App.showToast(data.detail || 'Slot booking failed');
        }
      } catch (e) {
        App.showToast('Network error while booking slot');
      }
    }

    fetchAvailability();
  </script>
</body>
</html>
